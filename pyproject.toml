[project]
name = "maple-mcp"
version = "0.1.0"
description = "MCP server for Maple computer algebra system"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
]

[project.scripts]
maple-mcp = "maple_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maple_mcp"]
